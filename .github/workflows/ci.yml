name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Primary toolchain: Node.js + npm. Runs the full check suite including the
  # packed artifact gate (verify:package), the enforced coverage gate, and the
  # example smoke tests.
  check:
    name: Node.js (check suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run test:types
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run verify:package
      - run: npx publint
      # Examples smoke (P2-07): examples are typechecked by `tsc` and executed
      # here so they cannot silently rot.
      - run: npx tsx examples/basic.ts
      - run: NODE_ENV=production REGION=eu-west-1 npx tsx examples/enum.ts
      - run: npx tsx examples/env-file.ts
      - run: PORT=99999 npx tsx examples/validation.ts
      - run: PORT=3001 HOST=127.0.0.1 NODE_ENV=test DATABASE_URL=https://example.com npx tsx examples/server.ts

  # Node.js runtime matrix (18 = engines floor, plus 20/22/24). Uses the
  # committed package-lock.json for reproducible installs via `npm ci`.
  # Vitest 4 (and its rolldown/vite dependency) requires Node >= 20.12
  # ("styleText" in node:util), so the vitest-only steps are skipped on the
  # Node 18 leg. Node 18 still verifies typecheck/lint/format/type tests/build/
  # verify:package/publint; the full vitest suite runs in the `check` job.
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
        include:
          - node-version: 20
            run-vitest: true
          - node-version: 22
            run-vitest: true
          - node-version: 24
            run-vitest: true
          - node-version: 18
            run-vitest: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests (Vitest)
        if: ${{ matrix.run-vitest }}
        run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run verify:package
      - run: npx publint

  # Deno runtime claim: import the built ESM core from a file URL and exercise
  # parsing, result errors, the core error classes, fromObject and fromDenoEnv.
  # The Node-only /load loader is intentionally not part of the Deno smoke.
  deno:
    name: Deno (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-env scripts/verify-deno.ts

  # The browser/core boundary is guarded by a vitest test (tests/browser.test.ts)
  # run in the `test` step of the check and node (20/22/24) jobs: esbuild bundles
  # a pure parser consumer for --platform=browser and asserts no fs/path/
  # readFileSync leaks into the core bundle.
